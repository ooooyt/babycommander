quarkus.http.port=${TOASTER_PORT:0}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO

# Disable console logging (Log.xxx goes to file only)
quarkus.log.console.enable=false

# File logging - all logs go to file
quarkus.log.file.enable=true
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.path=logs/app.log

# Dedicated tool-call log: complete tool-call arguments and results are written
# to a separate file (logs/tool-calls.log) instead of app.log. The "tool-calls"
# category is bound only to the TOOL_CALLS handler (use-parent-handlers=false),
# so these records never reach the root logger / app.log / console.
quarkus.log.handler.file."TOOL_CALLS".enable=true
quarkus.log.handler.file."TOOL_CALLS".path=logs/tool-calls.log
quarkus.log.handler.file."TOOL_CALLS".level=INFO
quarkus.log.handler.file."TOOL_CALLS".format=%d{yyyy-MM-dd HH:mm:ss} %s%e%n
quarkus.log.handler.file."TOOL_CALLS".rotation.max-file-size=50M
quarkus.log.handler.file."TOOL_CALLS".rotation.max-backup-index=5
quarkus.log.category."tool-calls".level=INFO
quarkus.log.category."tool-calls".handlers=TOOL_CALLS
quarkus.log.category."tool-calls".use-parent-handlers=false

# ObjectBox data directory (maps to DbConfig.directory())
db.directory=${user.home}/.babycommander/db/objectbox

# Memory and summarization settings
db.memory.max-messages=${DB_MAX_MESSAGES:200}
db.memory.max-tool-calls=${DB_MAX_TOOL_CALLS:80}
db.memory.summary-batch-size=${DB_SUMMARY_BATCH:20}
db.enabled=${DB_ENABLED:true}

# Summarizer config (uses default provider if summarizer.provider=default)
summarizer.provider=${SUMMARIZER_PROVIDER:default}
summarizer.model-name=${SUMMARIZER_MODEL:default}
summarizer.temperature=${SUMMARIZER_TEMPERATURE:0.3}

# data directory (user home)
babycommander.data-dir=${user.home}/.babycommander
