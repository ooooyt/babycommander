# =============================================================================
# babycommander - Gradle build properties
# Mirrors the <properties> section of pom.xml where applicable.
# =============================================================================

# Project coordinates (pom.xml: com.ooooyt:babycommander:0.0.1)
group=com.ooooyt
version=0.0.1

# Quarkus platform (pom.xml properties: quarkus.platform.*)
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.20.6.2

# Version properties (pom.xml properties)
langchain4jVersion=1.19.0
lombokVersion=1.18.46
objectboxVersion=4.3.0
antlr4Version=4.13.2
jlineVersion=3.30.14
jansiVersion=2.4.1
jsoupVersion=1.23.1
commonmarkVersion=0.28.0
mockitoVersion=5.14.2
compilerRelease=22

# -----------------------------------------------------------------------------
# JVM args for the Gradle daemon.
# These mirror the <jvmArgs> of quarkus-maven-plugin (required for the Quarkus
# build on modern JDKs). NOTE: --sun-misc-unsafe-memory-access requires JDK 23+.
# Gradle 8.x (recommended for Quarkus 3.20) supports daemons running on JDK 17-23,
# so run ./gradlew with a JDK 22/23 (JAVA_HOME or org.gradle.java.home).
# If you use an older JDK, remove the --sun-misc-unsafe-memory-access flag.
# -----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dnet.bytebuddy.experimental=true --add-opens=java.base/sun.misc=ALL-UNNAMED --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow

org.gradle.caching=true
org.gradle.parallel=true
